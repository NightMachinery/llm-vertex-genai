[project]
name = "llm-vertex-genai"
version = "0.3.0"
description = "LLM plugin for Gemini on Google Cloud Vertex AI, with attachments and a configurable model list"
dependencies = [
    "llm",
    "google-genai>=1.50.0",
]
readme = "README.md"
authors = [{name = "Justyn Shull"}, {name = "Viacheslav Vasilyev"}, {name = "NightMachinery"}]
license = {text = "Apache-2.0"}
classifiers = [
    "License :: OSI Approved :: Apache Software License"
]
requires-python = ">=3.9"

[project.urls]
Homepage = "https://github.com/NightMachinery/llm-vertex-genai"
Issues = "https://github.com/NightMachinery/llm-vertex-genai/issues"

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
]

[project.entry-points.llm]
vertex_genai = "llm_vertex_genai"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*",
]
